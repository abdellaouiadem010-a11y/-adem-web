<section id="guess-player">
    <h2>⚽ GUESS THE PLAYER</h2>
    <p>اختبر معلوماتك الكروية واكتشف هوية الأساطير!</p>

    <div class="game-info">
        <div class="stat">النقاط<strong id="game-score">0</strong></div>
        <div class="stat">السؤال<strong id="game-number">1 / 50</strong></div>
        <div class="stat">الوقت<strong id="game-time">30</strong></div>
    </div>

    <div class="progress">
        <div id="progress-bar"></div>
    </div>

    <p>مستوى الصعوبة</p>
    <select id="game-level" style="padding:10px;border-radius:8px;">
        <option value="easy">سهل</option>
        <option value="medium">متوسط</option>
        <option value="hard">صعب</option>
    </select>

    <div class="clue-box">
        <h3>من أنا؟ 🤔</h3>
        <p id="player-clue">اضغط على ابدأ اللعب!</p>
    </div>

    <button id="hint-button" onclick="showHint()">تلميح إضافي 💡</button>
    <br>

    <input id="player-answer" type="text"
           placeholder="اكتب اسم اللاعب..."
           autocomplete="off">

    <br>
    <button id="answer-button" onclick="checkAnswer()">تحقق من الإجابة</button>
    <button class="secondary" onclick="startGame()">ابدأ / أعد اللعبة</button>

    <div id="game-result"></div>
    <div id="player-reveal"></div>

    <button id="next-button" class="secondary"
            onclick="nextQuestion()" style="display:none;">
        اللاعب التالي ←
    </button>
</section>

 {name:"vinicius",clues:["جناح برازيلي.","ألعب مع ريال مدريد.","فزت بدوري الأبطال وسجلت في النهائي."]}
];

let order = [];
let current = 0;
let score = 0;
let hints = 0;
let timeLeft = 30;
let timer = null;
let answered = false;
let playing = false;

function normalize(value) {
    return value.toLowerCase().trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]/g,"");
}

function startGame() {
    clearInterval(timer);
    order = footballPlayers.map((p,i)=>i);

    const level = document.getElementById("game-level").value;
    if(level === "hard") order.reverse();
    if(level === "medium") order.sort(()=>Math.random()-.5);

    current = 0;
    score = 0;
    document.getElementById("game-score").textContent = score;
    playing = true;
    showQuestion();
}

function showQuestion() {
    clearInterval(timer);
    if(current >= order.length) {
        finishGame();
        return;
    }

    hints = 0;
    answered = false;
    timeLeft = 30;

    const player = footballPlayers[order[current]];
    document.getElementById("player-clue").textContent = player.clues[0];
    document.getElementById("game-number").textContent = (current+1)+" / "+order.length;
    document.getElementById("game-time").textContent = timeLeft;
    document.getElementById("game-result").textContent = "";
    document.getElementById("player-reveal").textContent = "";
    document.getElementById("player-answer").value = "";
    document.getElementById("player-answer").disabled = false;
    document.getElementById("answer-button").disabled = false;
    document.getElementById("hint-button").disabled = false;
    document.getElementById("next-button").style.display = "none";
    document.getElementById("progress-bar").style.width =
        (current/order.length*100)+"%";

    timer = setInterval(()=>{
        timeLeft--;
        document.getElementById("game-time").textContent = timeLeft;
        if(timeLeft <= 0) {
            clearInterval(timer);
            revealAnswer(false);
        }
    },1000);
}

function showHint() {
    if(answered || hints >= 2) return;
    hints++;
    const player = footballPlayers[order[current]];
    document.getElementById("player-clue").textContent =
        player.clues[0] + " " + player.clues[hints];
    if(hints === 2) {
        document.getElementById("hint-button").disabled = true;
    }
}

function checkAnswer() {
    if(answered || !playing) return;
    const answer = normalize(document.getElementById("player-answer").value);
    if(!answer) {
        document.getElementById("game-result").textContent =
            "اكتب اسم اللاعب أولاً!";
        return;
    }

    const correct = normalize(footballPlayers[order[current]].name);
    if(answer === correct) {
        score += Math.max(10,30-hints*10);
        document.getElementById("game-score").textContent = score;
        revealAnswer(true);
    } else {
        document.getElementById("game-result").textContent =
            "ليست الإجابة الصحيحة! حاول مرة أخرى.";
    }
}

function revealAnswer(correct) {
    if(answered) return;
    answered = true;
    clearInterval(timer);

    const player = footballPlayers[order[current]];
    document.getElementById("game-result").textContent =
        correct ? "إجابة صحيحة! 🏆" : "انتهى الوقت!";
    document.getElementById("player-reveal").textContent =
        "اللاعب هو: " + player.name.toUpperCase();

    document.getElementById("player-answer").disabled = true;
    document.getElementById("answer-button").disabled = true;
    document.getElementById("hint-button").disabled = true;
    document.getElementById("next-button").style.display = "inline-block";
}

function nextQuestion() {
    if(!answered) return;
    current++;
    showQuestion();
}

function finishGame() {
    playing = false;
    clearInterval(timer);
    document.getElementById("player-clue").textContent =
        "انتهت جميع الأسئلة!";
    document.getElementById("game-result").textContent =
        "أحسنت! نتيجتك النهائية: " + score + " نقطة من 1500";
    document.getElementById("player-reveal").textContent =
        "🏆 بطل ADEM FOOTBALL";
    document.getElementById("next-button").style.display = "none";
    document.getElementById("progress-bar").style.width = "100%";
}

document.getElementById("player-answer").addEventListener("keydown",function(e){
    if(e.key === "Enter") checkAnswer();
});
</script>
